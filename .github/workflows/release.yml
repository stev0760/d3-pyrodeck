name: Release

on:
  push:
    tags: ['v*']
  # Manual dry run: builds + uploads artifacts, skips the GitHub Release.
  workflow_dispatch:

jobs:
  # ── Linux binary ──────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/package-server.mjs --linux
      - name: Package Linux release
        run: |
          cd dist-server
          tar -czf ../pyrodeck-${{ github.ref_name }}-linux-x64.tar.gz \
            pyrodeck-server resources/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: pyrodeck-${{ github.ref_name }}-linux-x64.tar.gz

  # ── Windows binary (cross-compiled from Linux, unsigned) ──────────────
  # Code signing (SignPath/Azure) is deferred — see PLAN.md Phase 6.
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/package-server.mjs --windows
      - name: Package Windows release
        run: |
          cd dist-server
          zip -r ../pyrodeck-${{ github.ref_name }}-windows-x64.zip \
            pyrodeck-server.exe resources/
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: pyrodeck-${{ github.ref_name }}-windows-x64.zip

  # ── Create GitHub Release ─────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          body: |
            ## Installation

            **Linux x64** — extract the `.tar.gz`, run `./pyrodeck-server`

            **Windows x64** — extract the `.zip`, run `pyrodeck-server.exe`
            > The Windows binary is not code-signed yet, so SmartScreen will warn on first run.
            > Click **More info → Run anyway**.

            See [README](https://github.com/${{ github.repository }}#readme) for configuration and auth setup.
          files: |
            linux-release/*.tar.gz
            windows-release/*.zip
