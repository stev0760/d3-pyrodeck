[package]
name = "pyrodeck"
version = "0.6.1"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pyrodeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
